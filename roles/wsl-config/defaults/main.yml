---
# defaults file for wsl-win-integration

wsl_config_wsl_hostname:       ''
wsl_config_win_home_root:      "/mnt/c/Users"
wsl_config_win_user_appdata:   "{{ lookup('env','HOME') }}/AppData/Roaming"
wsl_config_integrate_services: true

# /etc/wsl.conf
wsl_config_etc_automount_enabled:          "true"
wsl_config_etc_automount_options:          "metadata,umask=22,fmask=11"
wsl_config_etc_automount_root:             ''
wsl_config_etc_automount_mountFsTab:       ''
wsl_config_etc_network_generateHosts:      "false"
wsl_config_etc_network_generateResolvConf: "true"

# /etc/hosts
wsl_config_hosts: []
#  - addr: 192.168.0.1
#    fqdn: test.example.com
#    short: test

wsl_config_users: []
#  - username: linuxusername
#    win_username: WindowsUsername
#    # Optionals
#    win_home_path: /mnt/c/Users/WindowsUsername

# /etc/resolve.conf
wsl_config_wsl_resolveConf: []
