---
# tasks file for wsl-win-integration

- name: "Require Correct Linux Distribution"
  assert:
    that: (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('22.0.0', '>=')) or
          'microsoft' in ansible_kernel | lower
    msg:  "This Linux distribution '{{ ansible_distribution }} {{ ansible_distribution_version }}' is not supported by the role."
  tags: wsl-config

# See https://github.com/microsoft/WSL/issues/4555#issuecomment-539674785
- name: "Detect WSL version"
  raw: test $(grep -oE "gcc version ([0-9]+)" /proc/version | awk '{print $3}') -gt 5 && echo "wsl2" || echo "wsl1"
  changed_when: false
  register: wsl_version
  args:
    executable: /bin/bash
  tags: always

- name: "Set WSL version fact"
  set_fact:
    wsl_version: "{{ wsl_version.stdout_lines[0] | lower }}"
    cacheable: false
  tags: always

- name: "Include OS/WSL Variables"
  include_vars: "{{ wsl_version }}/vars-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}.yml"
  tags: wsl-config

- name: "Run WSL-Specific Tasks"
  include_tasks: "tasks-{{ wsl_version }}.yml"
  tags: wsl-config


- name: "OS Dependencies"
  block:
    - name: "Install OS Dependencies"
      package:
        name: "{{ item }}"
        state: present
      with_items: "{{ wsl_config_os_dependencies }}"
      register: package_install_result
      failed_when: false
      when: wsl_config_os_dependencies is defined and wsl_config_os_dependencies | length > 0

    - name: "Report package installation issues"
      debug:
        msg: "Some packages may not have installed properly. This is common in WSL environments."
      when: package_install_result.results |
            default([]) |
            selectattr('failed', 'defined') |
            selectattr('failed') |
            list |
            length > 0
  tags: wsl-config

- name: "PIP Dependencies"
  pip:
    name: "{{ wsl_config_pip_dependencies }}"
    state: present
    executable: pip3
  tags: wsl-config


