---
- name: "OS Dependencies"
  block:
    - name: "Install OS Dependencies"
      apt:
        name: "{{ item }}"
        state: present
      with_items: "{{ wsl_config_os_dependencies }}"
      register: package_install_result
      failed_when: false
      when: wsl_config_os_dependencies is defined and wsl_config_os_dependencies | length > 0

    - name: "Report package installation issues"
      debug:
        msg: "Some packages may not have installed properly. This is common in WSL environments."
      when: package_install_result.results |
        default([]) |
        selectattr('failed', 'defined') |
        selectattr('failed') |
        list |
        length > 0

  tags: wsl-config

- name: "PIP Dependencies"
  pip:
    name: "{{ wsl_config_pip_dependencies }}"
    state: present
    executable: pip3
  tags: wsl-config

- set_fact:
    wsl_config_etc_network_generateResolvConf: "false"
    wsl_config_wsl_resolveConf:
      - { "nameserver": "8.8.8.8" }
  tags: wsl-config

- name: "Set system configuration"
  template:
    src: "{{ templates_root }}/etc/{{ item }}.j2"
    dest: "/etc/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  with_items:
    - resolv.conf
    - hosts
  tags: wsl-config

- name: "WSL-Windows : Disable Unwanted Services"
  shell: "update-rc.d {{ item }} remove"
  loop: "{{ wsl_config_nostart_services }}"
  changed_when: false

# # #  WSL-Windows Services Startup  # #

- name: "WSL-Windows Services"
  block:

   - name: "WSL-Windows : Linux-side Scripts"
     copy:
       src:   "{{ templates_root }}/tc/wsl-services-init"
       dest:  /etc/wsl-services-init
       owner: root
       group: root
       mode:  '0755'

   - name: "WSL-Windows : Sudo Permissions"
     lineinfile:
       path:   /etc/sudoers
       regexp: '/etc/wsl-services-init$'
       line:   '%sudo ALL=(ALL:ALL)NOPASSWD: /etc/wsl-services-init'

   - name: "WSL-Windows : Services Startup"
     template:
       src:   "{{ templates_root }}/etc/{{ item }}.j2"
       dest:  "/etc/{{ item }}"
       owner: root
       group: root
       mode:  '0644'
     loop:
      - wsl.conf
      - hosts

  when: wsl_config_integrate_services | default(true) | bool
  tags: wsl-config
